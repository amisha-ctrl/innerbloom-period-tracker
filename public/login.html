<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="./css/signin.css">
    <link rel="stylesheet" href="./assets/fontawesome/css/all.min.css">
</head>

<body>

    <div class="container">

        <!-- LEFT SECTION -->

        <div class="left">

            <div class="logo">
                <img src="./assets/images/InnerBloom Logo.png" width="200px" alt="InnerBloom Logo">
            </div>

            <h1>Good to See You Again</h1>

            <p>
                Your wellness journey continues here. Log in to view your cycle history, predictions and health
                insights.
            </p>

        </div>

        <!-- RIGHT SECTION -->

        <div class="right">

            <h2>Access Account</h2>

            <form id="loginForm">

                <div class="input-group">
                    <input type="email" id="email" placeholder="Enter your email">
                </div>

                <div class="input-group">
                    <input type="password" id="password" placeholder="Enter password">
                </div>

                <button type="submit" class="btn">Login</button>

                <p id="forgotPassword"
                    style="display: flex; justify-content: center; align-items: center; color: red; margin-top: 20px; font-size: 14px; cursor: pointer;">
                    Forgot Password?</p>

            </form>

            <div class="bottom-text">
                Don't have an Account?
                <a href="signup.html">Create One.</a>
            </div>

        </div>

    </div>

    <script src="./js/login.js"></script>

</body>

</html>
