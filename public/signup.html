<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="./css/signin.css">
    <link rel="stylesheet" href="./assets/fontawesome/css/all.min.css">
</head>

<body>

    <div class="container">

        <!-- LEFT SECTION -->

        <div class="left">

            <div class="logo">
                <img src="./assets/images/InnerBloom Logo.png" width="200px" alt="InnerBloom Logo">
            </div>

            <h1>Your Wellness Journey Starts Here</h1>

            <p>
                Track your health, understand your body, and build better self-care habits with personalized cycle
                tracking.
            </p>

        </div>

        <!-- RIGHT SECTION -->

        <div class="right">

            <h2>Create Account</h2>

            <form id="signUpForm" autocomplete="off">

                <div class="input-group">
                    <input type="text" id="name" placeholder="Enter your name" autocomplete="off">
                </div>

                <div class="input-group">
                    <input type="email" id="email" placeholder="Enter your email">
                </div>

                <div class="input-group">
                    <input type="password" id="password" placeholder="Enter password" autocomplete="new-password">
                </div>

                <div class="input-group">
                    <input type="text" id="location" placeholder="Enter Location" autocomplete="off">
                </div>

                <button type="submit" class="btn">Sign Up</button>

            </form>

            <div class="bottom-text">
                Already have an account?
                <a href="login.html">Login</a>
            </div>

        </div>

    </div>

    <script src="./js/signup.js"></script>

</body>

</html>
