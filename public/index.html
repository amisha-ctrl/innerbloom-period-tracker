<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authenticator</title>
    <link rel="stylesheet" href="./css/index.css">
    <link rel="stylesheet" href="./assets/fontawesome/css/all.min.css">
</head>

<body>

    <div class="container">

        <!-- LEFT SECTION -->

        <div class="left">

            <div class="logo">
                <img src="./assets/images/InnerBloom Logo.png" width="250px" alt="InnerBloom Logo">
            </div>

            <h1>
                Understand Your Cycle,
                Track Your Wellness.
            </h1>

            <p>
                A modern wellness platform that helps you track
                periods, symptoms, ovulation and cycle insights
                securely and privately.
            </p>

        </div>

        <!-- RIGHT SECTION -->

        <div class="right">

            <h2>Get Started</h2>

            <button class="btn signup-btn" id="signup">
                Sign Up
            </button>

            <button class="btn login-btn" id="login">
                Login
            </button>

        </div>

    </div>

    <script src="./js/index.js"></script>
</body>

</html>
